name: eggai-zero-trust
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda: null
services:
  redpanda:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: redpanda
    volumes:
      - redpanda:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=redpanda:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console -config.filepath=${CONFIG_FILEPATH:-/tmp/config.yml}'
    environment:
      CONFIG_FILEPATH: ${CONFIG_FILEPATH:-/tmp/config.yml}
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - 8080:8080
    depends_on:
      redpanda:
        condition: service_healthy

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: topic-init
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "
      echo 'Waiting for Redpanda cluster to be ready...' &&
      sleep 5 &&
      rpk topic create zt.humans --brokers=redpanda:9092 &&
      echo 'Topic zt.humans created successfully!' &&
      rpk topic create zt.agents --brokers=redpanda:9092 &&
      echo 'Topic zt.agents created successfully!'"

  auth_server:
    build: ./auth_server
    container_name: auth_server
    networks:
      - redpanda_network
    ports:
      - "8000:8000"
    env_file:
      - .env

  transactions_server:
    build: ./transactions_server
    container_name: transactions_server
    networks:
      - redpanda_network
    ports:
      - "8001:8001"
    environment:
      TRANSACTIONS_SERVER_CLIENT_SECRET: ${TRANSACTIONS_SERVER_CLIENT_SECRET}
    env_file:
      - .env

  chat_agent:
    build:
      context: .
      dockerfile: chat_agent/Dockerfile
    container_name: chat_agent
    networks:
      - redpanda_network
    depends_on:
      redpanda:
        condition: service_healthy
      auth_server:
        condition: service_started
      transactions_server:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      AUTH_SERVER_URL: http://auth_server:8000
      TRANSACTIONS_SERVER_URL: http://transactions_server:8001
      CHAT_AGENT_CLIENT_ID: ${CHAT_AGENT_CLIENT_ID}
      CHAT_AGENT_CLIENT_SECRET: ${CHAT_AGENT_CLIENT_SECRET}
    env_file:
      - .env
